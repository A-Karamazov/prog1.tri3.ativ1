    //Ancoras para mostrar os formulários de login e cadastro
    <a class="mostrarLogin" href="#login">Entrar</a>
    <a class="mostrarCadastro" href="#cadastro">Cadastrar-se</a>

    //Formulário de login 
    <form class="login" style="display: none;">
        <div>Fazer Login</div>
        <input type="text" name="username" placeholder="Usuário">
        <input type="password" name="password" placeholder="Senha">
        <button>Entrar</button>
    </form>

    //Formulário de cadastro
    <form class="cadastro" style="display: none;">
        <div>Cadastrar-se</div>
        <input type="text" name="username" placeholder="Usuário">
        <input type="password" name="password" placeholder="Senha">
        <button>Cadastrar-se</button>
    </form>

    <script>
        //Login
        const frmLogin = document.querySelector('.login')
        frmLogin.addEventListener('submit', async (ev) => {
            ev.preventDefault() //Evita que a página seja recarregada

            //Envia os dados do formulário para o servidor
            const response = await fetch("/login", { 
                method: "POST", 
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmLogin.username.value,
                    "password": frmLogin.password.value
                })
            })

            if (response.status == 404) return alert("Usuário não encontrado")

            if (response.status == 401) return alert("Senha incorreta")

            if (response.ok) {
                window.location.href = "/home"
                return
            }
        })

        

        //Cadastro
        const frmSignin = document.querySelector('.cadastro')
        frmSignin.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/user", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmSignin.username.value,
                    "password": frmSignin.password.value
                })
            })
            
            if (response.status == 404) return alert("Usuário não encontrado")

            if (response.status == 401) return alert("Senha incorreta")

            if (response.ok) {
                window.location.href = "/home"
                return
            }
        })


        //Ancora Login
        const linkLogin = document.querySelector(".mostrarLogin")
        linkLogin.addEventListener("click", () => {
            event.preventDefault();
            frmLogin.style.display = "block";
            frmSignin.style.display = "none"
        });

        //Ancora Cadstro
        const linkCadastro = document.querySelector(".mostrarCadastro")
        linkCadastro.addEventListener("click", () => {
            event.preventDefault();
            frmSignin.style.display = "block";
            frmLogin.style.display = "none"
        });
    </script>
</body>

</html>
