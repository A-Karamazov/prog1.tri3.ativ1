<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h1>HOME</h1>

    <div class="profile">
        <img class="thumb" src="" alt="">
        <div class="username">...</div>
    </div>

    <script>
        async function init() {
            const response = await fetch("/login/user", "user")

            if (!response.ok) {
                alert("Usuário não está logado")
                window.location.href = "/"
                return
            }
            const data = await response.json()
            document.querySelector(".profile .username").textContent = data.username

        }
    </script>
</body>
</html>
